<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | ThemeMarket</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/styles.css">

<style>

:root{
--primary-color:#ffc107;
--dark-green:#00403d;
--white:#ffffff;
--light:#eaeaea;
--text-muted:#6c757d;
--radius:10px;
--shadow:0 10px 30px rgba(0,0,0,0.15);
}

body{
font-family:'Poppins',sans-serif;
margin:0;
}

.auth-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#00403d,#00665f);
}

.auth-container{
width:100%;
max-width:420px;
}

.auth-box{
background:#fff;
padding:40px;
border-radius:var(--radius);
box-shadow:var(--shadow);
}

.auth-logo{
text-align:center;
margin-bottom:25px;
}

.auth-logo img{
max-width:150px;
}

.auth-title{
text-align:center;
font-size:28px;
font-weight:600;
margin-bottom:5px;
}

.auth-subtitle{
text-align:center;
color:var(--text-muted);
margin-bottom:25px;
}

.form-group{
margin-bottom:18px;
}

.form-control{
height:45px;
border-radius:8px;
border:2px solid var(--light);
}

.form-control:focus{
border-color:var(--primary-color);
box-shadow:none;
}

.password-wrapper{
position:relative;
}

.password-toggle{
position:absolute;
top:50%;
right:15px;
transform:translateY(-50%);
cursor:pointer;
color:#888;
}

.btn-primary{
background:var(--primary-color);
border:none;
height:45px;
font-weight:500;
}

.btn-primary:hover{
background:#e6ac00;
}

.social-login{
margin-top:25px;
border-top:1px solid var(--light);
padding-top:20px;
}

.social-btn{
width:100%;
height:45px;
border:2px solid var(--light);
background:#fff;
border-radius:8px;
margin-bottom:10px;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
font-weight:500;
}

.social-btn:hover{
border-color:var(--primary-color);
}

.back-home{
display:block;
text-align:center;
margin-top:20px;
color:var(--text-muted);
text-decoration:none;
}

.back-home:hover{
color:#000;
}

</style>

</head>

<body>

<div class="auth-page">

<div class="auth-container">

<div class="auth-box">

<div class="auth-logo">
<img src="assets/image/tez-logo.png" alt="TezTecch Logo">
</div>

<h2 class="auth-title">Welcome Back</h2>
<p class="auth-subtitle">Login to your account</p>

<form id="loginForm">

<div class="form-group">
<label>Email Address</label>
<input type="email" class="form-control" placeholder="Enter your email" required>
</div>

<div class="form-group">
<label>Password</label>

<div class="password-wrapper">

<input type="password" id="password" class="form-control" placeholder="Enter your password" required>

<i class="fas fa-eye password-toggle" onclick="togglePassword()"></i>

</div>

</div>

<div class="form-check mb-3">
<input class="form-check-input" type="checkbox" id="remember">
<label class="form-check-label">Remember me</label>
</div>

<button type="submit" class="btn btn-primary w-100">
Login
</button>

<div class="text-center mt-3">
<a href="#" style="color:#ffc107;text-decoration:none;">Forgot password?</a>
</div>

</form>

<div class="social-login">

<p class="text-center text-muted mb-3">Or continue with</p>

<button class="social-btn">
<i class="fab fa-google" style="color:#DB4437;"></i>
Continue with Google
</button>

<button class="social-btn">
<i class="fab fa-facebook-f" style="color:#4267B2;"></i>
Continue with Facebook
</button>

</div>

<p class="text-center mt-4">

Don't have an account?

<a href="register.html" style="color:#ffc107;font-weight:600;text-decoration:none;">
Sign up
</a>

</p>

<a href="index.html" class="back-home">
<i class="fas fa-arrow-left"></i> Back to Home
</a>

</div>

</div>

</div>

<script src="assets/js/stateManager.js?v=1"></script>
<script src="assets/js/utils.js?v=2"></script>
<script src="assets/js/api.js?v=2"></script>
<script>

function togglePassword(){

const password=document.getElementById("password");
const icon=document.querySelector(".password-toggle");

if(password.type==="password"){
password.type="text";
icon.classList.replace("fa-eye","fa-eye-slash");
}
else{
password.type="password";
icon.classList.replace("fa-eye-slash","fa-eye");
}

}

document.getElementById("loginForm").addEventListener("submit",async function(e){

e.preventDefault();

const email = this.querySelector('input[type="email"]').value;
const password = document.getElementById("password").value;
const submitBtn = this.querySelector('button[type="submit"]');

try {
    LoadingState.set(submitBtn, true, '<i class="fas fa-spinner fa-spin"></i> Logging in...');
    const response = await api.login({ email, password });
    
    Toast.success('Login successful! Redirecting...');
    setTimeout(() => {
        window.location.href = 'dashboard.html';
    }, 1000);
} catch (error) {
    handleApiError(error, 'login');
} finally {
    LoadingState.set(submitBtn, false);
}

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
