<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - ThemeMarket</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #ffcc00;
            --secondary: #00403d;
            --dark: #212529;
            --text: #333333;
            --muted: #6c757d;
            --white: #fafcfb;
            --bg-light: #f4f7f6;
            --success: #28a745;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.13);
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Open Sans', sans-serif;
            color: var(--text);
            background: var(--bg-light);
            line-height: 1.6;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
        }

        /* Navbar */
        .navbar {
            background: var(--white);
            box-shadow: var(--shadow-md);
            padding: 0.85rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--dark);
            text-decoration: none;
            gap: 0.5rem;
        }

        .brand-text {
            background: linear-gradient(90deg, var(--secondary), #006b67);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Page Header */
        .page-header {
            background: linear-gradient(135deg, var(--secondary) 0%, #006b67 100%);
            color: white;
            padding: 3rem 0;
            margin-bottom: 2rem;
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .stat-icon.yellow {
            background: rgba(255, 204, 0, 0.1);
            color: var(--primary);
        }

        .stat-icon.green {
            background: rgba(40, 167, 69, 0.1);
            color: var(--success);
        }

        .stat-icon.blue {
            background: rgba(0, 64, 61, 0.1);
            color: var(--secondary);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 0.3rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
        }

        /* Order Cards */
        .orders-container {
            display: grid;
            gap: 1.5rem;
        }

        .order-card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: var(--transition);
        }

        .order-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateX(5px);
        }

        .order-header {
            background: linear-gradient(135deg, var(--secondary), #006b67);
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-id {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .order-date {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .order-body {
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 80px 1fr auto;
            gap: 1.5rem;
            align-items: center;
        }

        .order-image {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
            background: var(--bg-light);
        }

        .order-details h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }

        .order-meta {
            display: flex;
            gap: 1.5rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .order-meta span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .order-footer {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
        }

        .order-amount {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--secondary);
            font-family: 'Poppins', sans-serif;
        }

        .order-status {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-completed {
            background: rgba(40, 167, 69, 0.1);
            color: var(--success);
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.1);
            color: #ffc107;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
        }

        .empty-state i {
            font-size: 5rem;
            color: var(--muted);
            opacity: 0.3;
            margin-bottom: 1.5rem;
        }

        .empty-state h3 {
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: var(--muted);
            margin-bottom: 1.5rem;
        }

        .btn-primary-tm {
            background: linear-gradient(90deg, var(--primary), #ffdb4d);
            color: var(--secondary);
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: var(--transition);
        }

        .btn-primary-tm:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 64, 61, 0.1);
            border-top-color: var(--secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <span class="brand-text">ThemeMarket</span>
            </a>
            <div class="d-flex gap-3">
                <a href="dashboard.html" class="btn btn-sm btn-outline-secondary">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1><i class="fas fa-shopping-bag"></i> My Orders</h1>
            <p>View your complete purchase history and order details</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-icon yellow">
                    <i class="fas fa-shopping-bag"></i>
                </div>
                <div class="stat-label">Total Orders</div>
                <div class="stat-value" id="totalOrders">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-label">Completed</div>
                <div class="stat-value" id="completedOrders">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon blue">
                    <i class="fas fa-dollar-sign"></i>
                </div>
                <div class="stat-label">Total Spent</div>
                <div class="stat-value" id="totalSpent">-</div>
            </div>
        </div>

        <!-- Orders List -->
        <div id="ordersContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading your orders...</p>
            </div>
        </div>
    </div>

    <script src="assets/js/stateManager.js?v=1"></script>
    <script src="assets/js/utils.js?v=2"></script>
    <script src="assets/js/api.js?v=2"></script>
    <script>
        // Check authentication
        if (!api.isLoggedIn()) {
            window.location.href = 'login.html';
        }

        // Load orders
        async function loadOrders() {
            try {
                const response = await fetch(`${API_BASE_URL}/user/orders`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load orders');

                const result = await response.json();
                renderOrders(result.data);
                updateStats(result.data);
            } catch (error) {
                console.error('Error loading orders:', error);
                document.getElementById('ordersContainer').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Failed to load orders</h3>
                        <p>${error.message}</p>
                        <button onclick="loadOrders()" class="btn-primary-tm">
                            <i class="fas fa-sync-alt"></i> Retry
                        </button>
                    </div>
                `;
            }
        }

        // Render orders
        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');

            if (!orders || orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-shopping-bag"></i>
                        <h3>No orders yet</h3>
                        <p>You haven't purchased any themes yet. Browse our collection and find your perfect theme!</p>
                        <a href="category.html" class="btn-primary-tm">
                            <i class="fas fa-search"></i> Browse Themes
                        </a>
                    </div>
                `;
                return;
            }

            // Sort by date (newest first)
            orders.sort((a, b) => new Date(b.order_date) - new Date(a.order_date));

            container.innerHTML = `
                <div class="orders-container">
                    ${orders.map(order => `
                        <div class="order-card">
                            <div class="order-header">
                                <div>
                                    <div class="order-id">Order #${order.id}</div>
                                    <div class="order-date">${formatDate(order.order_date)}</div>
                                </div>
                                <span class="order-status status-${order.status}">
                                    ${order.status}
                                </span>
                            </div>
                            <div class="order-body">
                                <img src="assets/image/${order.theme_image || 'theme6.jpeg'}" 
                                     alt="${order.theme_title}" 
                                     class="order-image"
                                     onerror="this.src='assets/image/theme6.jpeg'">
                                <div class="order-details">
                                    <h3>${order.theme_title}</h3>
                                    <div class="order-meta">
                                        <span><i class="fas fa-credit-card"></i> ${formatPaymentMethod(order.payment_method)}</span>
                                        <span><i class="fas fa-receipt"></i> Order #${order.id}</span>
                                    </div>
                                </div>
                                <div class="order-footer">
                                    <div class="order-amount">$${order.amount.toFixed(2)}</div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Update stats
        function updateStats(orders) {
            const totalOrders = orders.length;
            const completedOrders = orders.filter(o => o.status === 'completed').length;
            const totalSpent = orders.reduce((sum, order) => sum + order.amount, 0);

            document.getElementById('totalOrders').textContent = totalOrders;
            document.getElementById('completedOrders').textContent = completedOrders;
            document.getElementById('totalSpent').textContent = '$' + totalSpent.toFixed(2);
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Format payment method
        function formatPaymentMethod(method) {
            const methods = {
                'credit_card': 'Credit Card',
                'paypal': 'PayPal',
                'stripe': 'Stripe'
            };
            return methods[method] || method;
        }

        // Load on page ready
        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
